<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280">
  <!-- Folder back -->
  <path d="M 60 80 L 100 80 L 110 90 L 240 90 L 240 240 L 60 240 Z" fill="#FAC555"/>
  <!-- Folder darker tab -->
  <path d="M 220 90 L 240 90 L 240 240 L 220 240 Z" fill="#EAB308"/>
  <!-- Document paper -->
  <rect x="80" y="110" width="140" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Text lines -->
  <g stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round">
    <line x1="92" y1="125" x2="160" y2="125"/>
    <line x1="92" y1="140" x2="200" y2="140"/>
    <line x1="92" y1="155" x2="190" y2="155"/>
    <line x1="92" y1="170" x2="200" y2="170"/>
    <line x1="92" y1="185" x2="170" y2="185"/>
  </g>
  <!-- Signature -->
  <path d="M 90 210 Q 100 200 110 210 Q 120 220 130 210 Q 140 200 150 215" stroke="#1e40af" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Stamp -->
  <circle cx="190" cy="210" r="14" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="190" cy="210" r="10" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- Second paper peeking -->
  <rect x="70" y="100" width="140" height="120" fill="#ffffff" opacity="0.5" stroke="#e5e7eb" stroke-width="1"/>
</svg>
