<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450">
  <!-- Suit body -->
  <path d="M 70 220 Q 70 200 100 195 L 220 195 Q 250 200 250 220 L 270 440 L 50 440 Z" fill="#1e3a8a"/>
  <!-- White shirt -->
  <path d="M 130 200 L 160 250 L 190 200 L 190 220 L 160 270 L 130 220 Z" fill="#ffffff"/>
  <!-- Lapels -->
  <path d="M 100 200 L 145 250 L 145 350 Z" fill="#1e40af"/>
  <path d="M 220 200 L 175 250 L 175 350 Z" fill="#1e40af"/>
  <!-- Neck -->
  <path d="M 145 165 L 175 165 L 173 200 L 147 200 Z" fill="#92400e"/>
  <!-- Head -->
  <ellipse cx="160" cy="120" rx="48" ry="58" fill="#a16207"/>
  <!-- Hair -->
  <path d="M 115 95 Q 120 60 160 60 Q 200 60 205 95 Q 200 75 160 75 Q 120 75 115 95 Z" fill="#1f2937"/>
  <!-- Hand on chin (thinking pose) -->
  <ellipse cx="135" cy="170" rx="22" ry="28" fill="#a16207"/>
