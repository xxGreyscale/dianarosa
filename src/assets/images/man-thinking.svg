  <!-- Other arm down -->
  <path d="M 220 250 Q 240 320 250 400" stroke="#1e3a8a" stroke-width="50" stroke-linecap="round" fill="none"/>
  <ellipse cx="248" cy="405" rx="20" ry="25" fill="#a16207"/>
  <!-- Eyes (looking up) -->
  <ellipse cx="145" cy="115" rx="2.5" ry="3" fill="#1f2937"/>
  <ellipse cx="180" cy="115" rx="2.5" ry="3" fill="#1f2937"/>
</svg>
