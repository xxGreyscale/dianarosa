<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Truck cabin background -->
  <rect width="500" height="500" fill="#475569"/>
  <!-- Window/blur background -->
  <rect x="320" y="0" width="180" height="500" fill="#94a3b8" opacity="0.6"/>
  <rect x="0" y="0" width="100" height="500" fill="#1e293b" opacity="0.7"/>
  <!-- Steering wheel -->
  <circle cx="120" cy="350" r="80" fill="none" stroke="#1f2937" stroke-width="14"/>
  <circle cx="120" cy="350" r="20" fill="#1f2937"/>
  <line x1="120" y1="280" x2="120" y2="420" stroke="#1f2937" stroke-width="6"/>
  <!-- Body -->
  <path d="M 200 350 Q 200 320 240 315 L 360 315 Q 400 320 400 350 L 420 500 L 180 500 Z" fill="#9ca3af"/>
  <!-- Neck -->
  <path d="M 280 270 L 320 270 L 318 320 L 282 320 Z" fill="#7c2d12"/>
  <!-- Head -->
  <ellipse cx="300" cy="220" rx="65" ry="75" fill="#92400e"/>
  <!-- Beard -->
  <path d="M 245 230 Q 250 285 300 295 Q 350 285 355 230 Q 350 270 300 280 Q 250 270 245 230 Z" fill="#374151"/>
  <!-- Hair -->
  <path d="M 240 195 Q 250 150 300 145 Q 350 150 360 195 Q 350 165 300 165 Q 250 165 240 195 Z" fill="#1f2937"/>
  <!-- Eyes -->
  <ellipse cx="280" cy="220" rx="3.5" ry="4" fill="#1f2937"/>
  <ellipse cx="320" cy="220" rx="3.5" ry="4" fill="#1f2937"/>
  <!-- Smile -->
  <path d="M 275 250 Q 300 262 325 250" stroke="#1f2937" stroke-width="2.5" fill="none"/>
</svg>
