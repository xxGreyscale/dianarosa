<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450">
  <!-- White blouse -->
  <path d="M 90 230 Q 90 210 120 205 L 280 205 Q 310 210 310 230 L 330 440 L 70 440 Z" fill="#ffffff"/>
  <!-- Blouse shadow -->
  <path d="M 150 230 L 200 280 L 250 230 L 250 240 L 200 290 L 150 240 Z" fill="#e5e7eb"/>
  <!-- Neck -->
  <path d="M 180 170 L 220 170 L 215 210 L 185 210 Z" fill="#a16207"/>
  <!-- Head -->
  <ellipse cx="200" cy="130" rx="55" ry="65" fill="#b45309"/>
  <!-- Curly hair -->
  <g fill="#1f2937">
    <ellipse cx="155" cy="100" rx="20" ry="22"/>
    <ellipse cx="135" cy="125" rx="18" ry="22"/>
    <ellipse cx="245" cy="100" rx="20" ry="22"/>
    <ellipse cx="265" cy="125" rx="18" ry="22"/>
    <ellipse cx="170" cy="80" rx="22" ry="20"/>
    <ellipse cx="200" cy="70" rx="25" ry="20"/>
    <ellipse cx="230" cy="80" rx="22" ry="20"/>
    <ellipse cx="150" cy="155" rx="14" ry="16"/>
    <ellipse cx="250" cy="155" rx="14" ry="16"/>
  </g>
  <!-- Headset band -->
  <path d="M 145 100 Q 200 50 255 100" stroke="#1f2937" stroke-width="5" fill="none"/>
  <!-- Ear pieces -->
  <circle cx="145" cy="125" r="12" fill="#1f2937"/>
  <circle cx="255" cy="125" r="12" fill="#1f2937"/>
  <!-- Mic boom -->
  <line x1="255" y1="135" x2="240" y2="160" stroke="#1f2937" stroke-width="3"/>
  <circle cx="238" cy="162" r="4" fill="#1f2937"/>
  <!-- Hand on phone -->
  <ellipse cx="155" cy="170" rx="20" ry="25" fill="#b45309"/>
  <!-- Smile -->
  <path d="M 180 150 Q 200 162 220 150" stroke="#7c2d12" stroke-width="2" fill="none"/>
  <!-- Eyes -->
  <ellipse cx="180" cy="125" rx="3" ry="4" fill="#1f2937"/>
  <ellipse cx="220" cy="125" rx="3" ry="4" fill="#1f2937"/>
  <!-- Desk hint -->
  <rect x="0" y="420" width="400" height="30" fill="#0f172a"/>
</svg>
