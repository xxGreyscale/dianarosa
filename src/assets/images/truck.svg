<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Trailer container -->
  <rect x="40" y="140" width="440" height="220" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <!-- Trailer top edge -->
  <rect x="40" y="140" width="440" height="20" fill="#d1d5db"/>
  <!-- Logo on trailer -->
  <g transform="translate(120, 200)">
    <path d="M 60 20 L 25 90 L 95 90 Z" fill="#111111"/>
    <path d="M 60 20 L 95 90 L 60 90 Z" fill="#B8860B"/>
    <text x="120" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#111111">DIANAROSE</text>
    <text x="120" y="92" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" letter-spacing="4">LOGISTICS</text>
  </g>
  <!-- Cab -->
  <path d="M 480 200 L 550 200 L 580 240 L 700 240 L 700 360 L 480 360 Z" fill="#111111"/>
  <!-- Cab gold accent -->
  <path d="M 580 280 L 700 280 L 700 360 L 580 360 Z" fill="#B8860B"/>
  <!-- Windscreen -->
  <path d="M 555 215 L 575 245 L 660 245 L 660 215 Z" fill="#9ca3af" opacity="0.7"/>
  <!-- Side windows -->
  <rect x="495" y="215" width="50" height="40" fill="#9ca3af" opacity="0.7"/>
  <!-- Wheels -->
  <circle cx="120" cy="380" r="35" fill="#1f2937"/>
  <circle cx="120" cy="380" r="14" fill="#6b7280"/>
  <circle cx="200" cy="380" r="35" fill="#1f2937"/>
  <circle cx="200" cy="380" r="14" fill="#6b7280"/>
  <circle cx="380" cy="380" r="35" fill="#1f2937"/>
  <circle cx="380" cy="380" r="14" fill="#6b7280"/>
  <circle cx="540" cy="380" r="35" fill="#1f2937"/>
  <circle cx="540" cy="380" r="14" fill="#6b7280"/>
  <circle cx="640" cy="380" r="35" fill="#1f2937"/>
  <circle cx="640" cy="380" r="14" fill="#6b7280"/>
  <!-- Bumper detail -->
  <rect x="700" y="320" width="30" height="20" fill="#374151"/>
</svg>
