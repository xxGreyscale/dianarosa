<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1400" height="500" fill="url(#sky)"/>
  <!-- Water -->
  <rect y="500" width="1400" height="200" fill="url(#water)"/>
  <!-- Ship hull -->
  <path d="M 300 380 L 1100 380 L 1050 470 L 350 470 Z" fill="#0f172a" opacity="0.95"/>
  <!-- Ship superstructure -->
  <rect x="950" y="300" width="120" height="80" fill="#1e293b"/>
  <rect x="990" y="220" width="40" height="80" fill="#334155"/>
  <!-- Containers stacked -->
  <g opacity="0.9">
    <rect x="380" y="320" width="100" height="60" fill="#b45309"/>
    <rect x="480" y="320" width="100" height="60" fill="#7c2d12"/>
    <rect x="580" y="320" width="100" height="60" fill="#a16207"/>
    <rect x="680" y="320" width="100" height="60" fill="#92400e"/>
    <rect x="780" y="320" width="100" height="60" fill="#78350f"/>
    <rect x="430" y="260" width="100" height="60" fill="#9a3412"/>
    <rect x="530" y="260" width="100" height="60" fill="#a16207"/>
    <rect x="630" y="260" width="100" height="60" fill="#7c2d12"/>
    <rect x="730" y="260" width="100" height="60" fill="#b45309"/>
    <rect x="480" y="200" width="100" height="60" fill="#92400e"/>
    <rect x="580" y="200" width="100" height="60" fill="#a16207"/>
    <rect x="680" y="200" width="100" height="60" fill="#78350f"/>
  </g>
  <!-- Crane -->
  <g stroke="#4b5563" stroke-width="6" fill="none">
    <line x1="180" y1="500" x2="180" y2="100"/>
    <line x1="180" y1="100" x2="320" y2="100"/>
    <line x1="320" y1="100" x2="320" y2="180"/>
    <line x1="180" y1="160" x2="320" y2="100"/>
  </g>
  <!-- Truck on dock -->
  <g>
    <rect x="1050" y="450" width="160" height="50" fill="#e5e7eb"/>
    <rect x="1180" y="430" width="60" height="70" fill="#9ca3af"/>
    <circle cx="1080" cy="510" r="18" fill="#1f2937"/>
    <circle cx="1130" cy="510" r="18" fill="#1f2937"/>
    <circle cx="1200" cy="510" r="18" fill="#1f2937"/>
  </g>
  <!-- Reflection -->
  <rect y="500" width="1400" height="200" fill="#000" opacity="0.2"/>
</svg>
